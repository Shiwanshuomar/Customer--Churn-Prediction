<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Churn Prediction AI</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:linear-gradient(-45deg,#0f172a,#1e3a8a,#6d28d9,#0ea5e9);
background-size:400% 400%;
animation:bg 12s ease infinite;
min-height:100vh;
padding:40px;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.container-box{

max-width:1300px;
margin:auto;

background:rgba(255,255,255,.08);

backdrop-filter:blur(18px);

border-radius:25px;

padding:35px;

box-shadow:0 15px 40px rgba(0,0,0,.35);

color:white;

}

.header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:35px;

}

.header h1{

font-size:38px;

font-weight:700;

}

.logout{

background:#ff4d4d;

color:white;

padding:10px 22px;

border-radius:12px;

text-decoration:none;

font-weight:bold;

transition:.3s;

}

.logout:hover{

background:#ff2222;
color:white;
transform:scale(1.05);

}

.card-glass{

background:rgba(255,255,255,.12);

padding:20px;

border-radius:20px;

margin-bottom:20px;

transition:.3s;

}

.card-glass:hover{

transform:translateY(-5px);

box-shadow:0 10px 30px rgba(0,0,0,.35);

}

label{

font-weight:600;

margin-bottom:6px;

}

.form-control,
.form-select{

background:rgba(255,255,255,.9);

border:none;

border-radius:10px;

}

.predict-btn{

width:100%;

padding:15px;

font-size:20px;

font-weight:bold;

border:none;

border-radius:14px;

background:linear-gradient(90deg,#00dbde,#fc00ff);

color:white;

transition:.3s;

margin-top:15px;

}

.predict-btn:hover{

transform:scale(1.02);

box-shadow:0 10px 25px rgba(0,0,0,.4);

}

.result{

margin-top:35px;

padding:25px;

border-radius:18px;

background:rgba(255,255,255,.12);

text-align:center;

}

.progress{

height:28px;

border-radius:20px;

background:#ddd;

overflow:hidden;

}

.progress-bar{

font-weight:bold;

font-size:15px;

}

</style>

</head>

<body>

<div class="container-box">

<div class="header">

<h1>🤖 Customer Churn Prediction AI</h1>

<div>

<a href="/history" class="btn btn-warning me-2">
📜 History
</a>

<a href="/logout" class="logout">
Logout
</a>

</div>

</div>

<form action="/" method="POST">

<div class="row">

<div class="col-lg-4">

<div class="card-glass">

<label>Gender</label>

<select class="form-select" name="gender">

<option value="Male"
{% if form_data.get('gender') == 'Male' %}selected{% endif %}>
Male
</option>

<option value="Female"
{% if form_data.get('gender') == 'Female' %}selected{% endif %}>
Female
</option>

</select>

<label class="mt-3">Senior Citizen</label>

<select class="form-select" name="SeniorCitizen">

<option value="0"
{% if form_data.get('SeniorCitizen') == '0' %}selected{% endif %}>
No
</option>

<option value="1"
{% if form_data.get('SeniorCitizen') == '1' %}selected{% endif %}>
Yes
</option>

</select>

<label class="mt-3">Partner</label>
<select class="form-select" name="Partner">

<option value="Yes"
{% if form_data.get('Partner') == 'Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if form_data.get('Partner') == 'No' %}selected{% endif %}>
No
</option>

</select>

<label class="mt-3">Dependents</label>
<select class="form-select" name="Dependents">

<option value="Yes"
{% if form_data.get('Dependents') == 'Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if form_data.get('Dependents') == 'No' %}selected{% endif %}>
No
</option>

</select>

<label class="mt-3">Tenure</label>
<input
type="number"
class="form-control"
name="tenure"
value="{{ form_data.get('tenure','') }}"
required>

<label class="mt-3">Phone Service</label>
<select class="form-select" name="PhoneService">

<option value="Yes"
{% if form_data.get('PhoneService') == 'Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if form_data.get('PhoneService') == 'No' %}selected{% endif %}>
No
</option>

</select>

</div>

</div>

<div class="col-lg-4">

<div class="card-glass">

<label>Multiple Lines</label>
<select class="form-select" name="MultipleLines">

<option value="Yes"
{% if form_data.get('MultipleLines') == 'Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if form_data.get('MultipleLines') == 'No' %}selected{% endif %}>
No
</option>

<option value="No phone service"
{% if form_data.get('MultipleLines') == 'No phone service' %}selected{% endif %}>
No phone service
</option>

</select>

<label class="mt-3">Internet Service</label>
<select class="form-select" name="InternetService">

<option value="DSL"
{% if form_data.get('InternetService') == 'DSL' %}selected{% endif %}>
DSL
</option>

<option value="Fiber optic"
{% if form_data.get('InternetService') == 'Fiber optic' %}selected{% endif %}>
Fiber optic
</option>

<option value="No"
{% if form_data.get('InternetService') == 'No' %}selected{% endif %}>
No
</option>

</select>

<label class="mt-3">Online Security</label>
<select class="form-select" name="OnlineSecurity">

<option value="Yes"
{% if form_data.get('OnlineSecurity') == 'Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if form_data.get('OnlineSecurity') == 'No' %}selected{% endif %}>
No
</option>

<option value="No internet service"
{% if form_data.get('OnlineSecurity') == 'No internet service' %}selected{% endif %}>
No internet service
</option>

</select>

<label class="mt-3">Online Backup</label>
<select class="form-select" name="OnlineBackup">

<option value="Yes"
{% if form_data.get('OnlineBackup') == 'Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if form_data.get('OnlineBackup') == 'No' %}selected{% endif %}>
No
</option>

<option value="No internet service"
{% if form_data.get('OnlineBackup') == 'No internet service' %}selected{% endif %}>
No internet service
</option>

</select>



<label class="mt-3">Device Protection</label>

<select class="form-select" name="DeviceProtection">

<option value="Yes"
{% if form_data.get('DeviceProtection') == 'Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if form_data.get('DeviceProtection') == 'No' %}selected{% endif %}>
No
</option>

<option value="No internet service"
{% if form_data.get('DeviceProtection') == 'No internet service' %}selected{% endif %}>
No internet service
</option>

</select>

<label class="mt-3">Tech Support</label>
<select class="form-select" name="TechSupport">

<option value="Yes"
{% if form_data.get('TechSupport') == 'Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if form_data.get('TechSupport') == 'No' %}selected{% endif %}>
No
</option>

<option value="No internet service"
{% if form_data.get('TechSupport') == 'No internet service' %}selected{% endif %}>
No internet service
</option>

</select>

</div>

</div>

<div class="col-lg-4">

<div class="card-glass">

<label class="mt-3">Streaming TV</label>
<select class="form-select" name="StreamingTV">

<option value="Yes"
{% if form_data.get('StreamingTV') == 'Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if form_data.get('StreamingTV') == 'No' %}selected{% endif %}>
No
</option>

<option value="No internet service"
{% if form_data.get('StreamingTV') == 'No internet service' %}selected{% endif %}>
No internet service
</option>

</select>

<label class="mt-3">Streaming Movies</label>
<select class="form-select" name="StreamingMovies">

<option value="Yes"
{% if form_data.get('StreamingMovies') == 'Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if form_data.get('StreamingMovies') == 'No' %}selected{% endif %}>
No
</option>

<option value="No internet service"
{% if form_data.get('StreamingMovies') == 'No internet service' %}selected{% endif %}>
No internet service
</option>

</select>

<label class="mt-3">Contract</label>
<select class="form-select" name="Contract">

<option value="Month-to-month"
{% if form_data.get('Contract') == 'Month-to-month' %}selected{% endif %}>
Month-to-month
</option>

<option value="One year"
{% if form_data.get('Contract') == 'One year' %}selected{% endif %}>
One year
</option>

<option value="Two year"
{% if form_data.get('Contract') == 'Two year' %}selected{% endif %}>
Two year
</option>

</select>

<label class="mt-3">Paperless Billing</label>
<select class="form-select" name="PaperlessBilling">

<option value="Yes"
{% if form_data.get('PaperlessBilling') == 'Yes' %}selected{% endif %}>
Yes
</option>

<option value="No"
{% if form_data.get('PaperlessBilling') == 'No' %}selected{% endif %}>
No
</option>

</select>

<label class="mt-3">Payment Method</label>
<select class="form-select" name="PaymentMethod">

<option value="Electronic check"
{% if form_data.get('PaymentMethod') == 'Electronic check' %}selected{% endif %}>
Electronic check
</option>

<option value="Mailed check"
{% if form_data.get('PaymentMethod') == 'Mailed check' %}selected{% endif %}>
Mailed check
</option>

<option value="Bank transfer (automatic)"
{% if form_data.get('PaymentMethod') == 'Bank transfer (automatic)' %}selected{% endif %}>
Bank transfer (automatic)
</option>

<option value="Credit card (automatic)"
{% if form_data.get('PaymentMethod') == 'Credit card (automatic)' %}selected{% endif %}>
Credit card (automatic)
</option>

</select>

<label class="mt-3">Monthly Charges</label>
<input
type="number"
step="0.01"
class="form-control"
name="MonthlyCharges"
value="{{ form_data.get('MonthlyCharges','') }}"
required>

<label class="mt-3">Total Charges</label>
<input
type="number"
step="0.01"
class="form-control"
name="TotalCharges"
value="{{ form_data.get('TotalCharges','') }}"
required>

</div>

</div>

</div>

<hr class="my-4">

<div class="text-center mb-3">
    <a href="/bulk_prediction" class="btn btn-success btn-lg">
        📂 Bulk Customer Prediction (CSV)
    </a>
</div>

<button class="predict-btn" type="submit">
🚀 Predict Churn
</button>

</form>


</div>

</body>
</html>
