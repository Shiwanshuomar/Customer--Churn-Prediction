<!DOCTYPE html>
<html>
<head>

<title>AI Recommendations</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#0f172a;
color:white;
padding:40px;
}

.box{
max-width:900px;
margin:auto;
background:#1e293b;
padding:30px;
border-radius:20px;
}

</style>

</head>

<body>

<div class="box">

<h2>💡 AI Retention Recommendations</h2>

<hr>

<ul class="mt-4">

{% for tip in data.recommendations %}

<li class="mb-3">{{ tip }}</li>

{% endfor %}

</ul>

<a href="/" class="btn btn-success">
🏠 Home
</a>

</div>

</body>
</html>
