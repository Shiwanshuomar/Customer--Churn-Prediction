<!DOCTYPE html>
<html>
<head>
    <title>AI Explanation</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

    body{
        background:#0f172a;
        color:white;
        padding:40px;
    }

    .box{
        max-width:900px;
        margin:auto;
        background:#1e293b;
        padding:30px;
        border-radius:20px;
    }

    </style>

</head>

<body>

<div class="box">

<h2>🤖 AI Explanation</h2>

<hr>

<ul class="mt-4">

{% for reason in data.explanation %}

<li class="mb-3">{{ reason }}</li>

{% endfor %}

</ul>

<a href="/" class="btn btn-primary">
🏠 Home
</a>

</div>

</body>
</html>
