<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:linear-gradient(135deg,#4f46e5,#7c3aed);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{
            width:420px;
            border:none;
            border-radius:20px;
            padding:30px;
            box-shadow:0 20px 40px rgba(0,0,0,.25);
        }

        h2{
            text-align:center;
            margin-bottom:25px;
            font-weight:bold;
        }

        .btn-primary{
            width:100%;
            border-radius:12px;
        }

        a{
            text-decoration:none;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>Create Account</h2>

    {% if error %}
    <div class="alert alert-danger">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <div class="mb-3">
            <label>Email</label>
            <input
                type="email"
                name="email"
                class="form-control"
                required>
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input
                type="password"
                name="password"
                class="form-control"
                required>
        </div>

        <button class="btn btn-primary">
            Register
        </button>

    </form>

    <hr>

    <p class="text-center">
        Already have an account?
        <a href="/login">Login</a>
    </p>

</div>

</body>
</html>
